# Atelier 1 : recharger data/offres.ndjson dans l'index "offres" du TP.
input {
  file {
    path => "/data/offres.ndjson"
    mode => "read"                                  # lecture complète, pas de suivi en continu
    codec => "json"                                 # une ligne = un objet JSON
    sincedb_path => "/dev/null"                     # relit le fichier à chaque démarrage (labo)
    file_completed_action => "log"                  # défaut "delete" : supprimerait le fichier
    file_completed_log_path => "/usr/share/logstash/data/offres_lus.log"
  }
}

filter {
  # Champs ajoutés par Logstash, refusés par le mapping "dynamic": "strict" de l'index
  mutate {
    remove_field => ["@timestamp", "@version", "event", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "offres"
    document_id => "%{id}"                          # _id métier : ingestion idempotente
    action => "index"
    data_stream => "false"
    manage_template => false                        # le mapping existe déjà (TP, exercice 1.4)
  }
}
